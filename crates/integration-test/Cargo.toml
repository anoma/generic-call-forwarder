[package]
name = "anoma-generic-call-forwarder-integration-test"
description = "Integration and e2e tests for the Anoma generic call forwarder."
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
publish = false

[features]
default = []
e2e = ["anoma-pa-evm-integration-test/e2e"]

[dependencies]
anoma-pa-testkit = { workspace = true, features = ["fixtures"] }
# Normal dep (not dev) only because the `e2e` feature references it; the lib
# itself uses it solely via tests.
anoma-pa-evm-integration-test = { workspace = true }
anoma-generic-call-forwarder-bindings = { workspace = true }
anoma-generic-call-library = { workspace = true }
anoma-generic-call-witness = { workspace = true }
anoma-rm-risc0 = { workspace = true }

alloy = { workspace = true, features = [
  "contract",
  "json",
  "providers",
  "signer-local",
  "sol-types",
] }
alloy-chains = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
regex = { workspace = true }
risc0-zkvm = { workspace = true }

[dev-dependencies]
anoma-pa-testkit = { workspace = true, features = ["mocks"] }
# generic-call only needs the AnomaPay ERC20 app *deployed* in its test setup.
anomapay-erc20-forwarder-integration-test = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true }
