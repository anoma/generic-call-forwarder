[workspace]
resolver = "3"
members = ["crates/bindings", "crates/integration-test"]

[workspace.package]
keywords = ["anoma", "evm", "protocol-adapter", "forwarder"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/generic-call-forwarder"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.4.1", features = ["full", "eip712", "node-bindings"] }
alloy-chains = "0.2.36"
# The circuit crates are pinned exactly: another build has another logic ref, and so another kind.
anoma-generic-call-library = "=3.0.0-rc.2"
anoma-generic-call-witness = "=3.0.0-rc.2"
anoma-pa-evm-bindings = "3.0.0-rc.10"
anoma-pa-testkit = "1.0.0-rc.1"
anoma-rm-risc0 = { version = "2.0.0-rc.6", features = ["bonsai", "aggregation"] }
anoma-rm-risc0-gadgets = "2.0.0-rc.6"
anyhow = "1.0"
bincode = "1.3.3"
dotenvy = "0.15.7"
regex = "1.12.3"
risc0-zkvm = "3.0.3"
rstest = "0.26.1"
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["rt-multi-thread"] }


# Forwarder bindings (this repo)
anoma-generic-call-forwarder-bindings = { path = "crates/bindings" }

# Upstream test crates, pinned by git tag (see anoma-pa-testkit ADR-0002). For
# cross-repo development, override locally with a `[patch]` to a path checkout.
anoma-pa-evm-integration-test = { git = "https://github.com/anoma/pa-evm", tag = "bindings/v3.0.0-rc.10" }
anomapay-erc20-forwarder-integration-test = { git = "https://github.com/anoma/anomapay-erc20-forwarder", tag = "bindings/v3.0.0-rc.10" }
