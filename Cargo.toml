[workspace]
resolver = "3"
members = ["crates/bindings", "crates/integration-test"]

[workspace.package]
keywords = ["anoma", "evm", "protocol-adapter", "forwarder"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/generic-call-forwarder"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.5.0", features = ["full", "eip712", "node-bindings"] }
alloy-chains = "0.2.39"
# The circuit crates are pinned exactly: another build has another logic ref, and so another kind.
anoma-generic-call-library = { git = "https://github.com/anoma/generic-call-resource", tag = "v2.0.0-rc.2" }
anoma-generic-call-witness = { git = "https://github.com/anoma/generic-call-resource", tag = "v2.0.0-rc.2" }
anoma-pa-evm-bindings = { git = "https://github.com/anoma/pa-evm", rev = "58af90ab0dd126af8334e882a06eabeebd62685c" }
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "579a6b352ba7891029e64389f02c7da8844c7cac" }
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", tag = "v2.0.0-rc.7.1", features = ["bonsai", "aggregation"] }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", tag = "v2.0.0-rc.7.1" }
anyhow = "1.0.104"
bincode = "1.3.3"
dotenvy = "0.15.7"
regex = "1.13.1"
risc0-zkvm = "3.0.6"
rstest = "0.28.0"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }


# Forwarder bindings (this repo)
anoma-generic-call-forwarder-bindings = { path = "crates/bindings" }

# Upstream test crates, pinned by git tag or commit (see anoma-pa-testkit ADR-0002). For
# cross-repo development, override locally with a `[patch]` to a path checkout.
anoma-pa-evm-integration-test = { git = "https://github.com/anoma/pa-evm", rev = "58af90ab0dd126af8334e882a06eabeebd62685c" }
anomapay-erc20-forwarder-integration-test = { git = "https://github.com/anoma/anomapay-erc20-forwarder", rev = "ffa3782bc4eaac09a907a5e37f85ee1696b77fe4" }

# The legacy ERC20 circuit crate, which the ERC20 forwarder fixtures use, takes arm-risc0 from crates.io; this resolves
# it to the tag the workspace pins.
[patch.crates-io]
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", tag = "v2.0.0-rc.7.1" }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", tag = "v2.0.0-rc.7.1" }
