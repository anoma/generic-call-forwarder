[workspace]
resolver = "3"
members = ["crates/bindings", "crates/integration-test"]

[workspace.package]
keywords = ["anoma", "evm", "protocol-adapter", "forwarder"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/generic-call-forwarder"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.5.0", features = ["full", "eip712", "node-bindings"] }
alloy-chains = "0.2.39"
# The circuit crates are pinned exactly: another build has another logic ref, and so another kind.
anoma-generic-call-library = { git = "https://github.com/anoma/generic-call-resource", rev = "2cf15befc7f905cb0edff08b1140739f8c8b1b66" }
anoma-generic-call-witness = { git = "https://github.com/anoma/generic-call-resource", rev = "2cf15befc7f905cb0edff08b1140739f8c8b1b66" }
anoma-pa-evm-bindings = { git = "https://github.com/anoma/pa-evm", rev = "15b0dd16541f7fdc0c45b725a24b7b58963770a9" }
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "8e124da1f640a29e7814a8c6fcdbf9419b6dfad6" }
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e", features = ["bonsai", "aggregation"] }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e" }
anyhow = "1.0.104"
bincode = "1.3.3"
dotenvy = "0.15.7"
regex = "1.13.1"
risc0-zkvm = "3.0.6"
rstest = "0.28.0"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }


# Forwarder bindings (this repo)
anoma-generic-call-forwarder-bindings = { path = "crates/bindings" }

# Upstream test crates, pinned by git tag or commit (see anoma-pa-testkit ADR-0002). For
# cross-repo development, override locally with a `[patch]` to a path checkout.
anoma-pa-evm-integration-test = { git = "https://github.com/anoma/pa-evm", rev = "15b0dd16541f7fdc0c45b725a24b7b58963770a9" }
anomapay-erc20-forwarder-integration-test = { git = "https://github.com/anoma/anomapay-erc20-forwarder", rev = "15d32a63bda385ba7a074e2a5b63984911745645" }

# The legacy ERC20 circuit crate, which the ERC20 forwarder fixtures use, takes arm-risc0 from crates.io; this resolves
# it to the commit the workspace pins.
[patch.crates-io]
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e" }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e" }
