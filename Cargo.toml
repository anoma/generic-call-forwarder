[workspace]
resolver = "3"
members = ["crates/bindings", "crates/integration-test"]

[workspace.package]
keywords = ["anoma", "evm", "protocol-adapter", "forwarder"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/generic-call-forwarder"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.0.5", features = ["full", "eip712", "node-bindings"] }
alloy-chains = "0.2.33"
anoma-generic-call-library = "1.0.0"
anoma-generic-call-witness = "1.0.0"
anoma-pa-evm-bindings = "2.3.0"
anoma-rm-risc0 = { version = "1.1.1", default-features = false }
anoma-rm-risc0-gadgets = "1.1.1"
anyhow = "1.0"
bincode = "1.3.3"
dotenvy = "0.15.7"
regex = "1.12.3"
risc0-zkvm = "3.0.3"
rstest = "0.26.1"
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["rt-multi-thread"] }


# Forwarder bindings (this repo)
anoma-generic-call-forwarder-bindings = { path = "crates/bindings" }

# Upstream test crates. anoma-pa-testkit and pa-evm are pinned by git rev (see
# ADR-0002); the erc20 integration-test crate stays a local path until erc20 is
# pushed and pinned by git rev too. For cross-repo dev, override with `[patch]`.
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "74cf6ad7cd488021128c34662e68171c7ae28e6d" }
anoma-pa-evm-integration-test = { git = "https://github.com/anoma/pa-evm", rev = "95179723a8515337a90276d47374237c3e5a7784" }
anomapay-erc20-forwarder-integration-test = { git = "https://github.com/anoma/anomapay-erc20-forwarder", rev = "ccdf93b869521261c8ebc2d05145abb782a8cc4d" }
